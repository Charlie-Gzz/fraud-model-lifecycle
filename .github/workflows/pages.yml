# Publishes site/ to GitHub Pages. Prepared but NOT enabled: it only runs by hand
# (workflow_dispatch), and Pages is off in the repo settings. Charlie turns it on after
# the repo goes public (see docs/HANDOFF.md, pre-public checklist).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
