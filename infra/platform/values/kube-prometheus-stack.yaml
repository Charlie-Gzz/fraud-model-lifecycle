# kube-prometheus-stack, trimmed for a single-node laptop cluster.
commonLabels:
  project: fraud-model-lifecycle

# The default rules alert on control-plane parts kind does not expose. Ours live in k8s/.
defaultRules:
  create: false

# kind runs these inside the node container where Prometheus cannot reach them.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
nodeExporter: { enabled: false }
windowsMonitoring: { enabled: false }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
  admissionWebhooks:
    patch:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }

prometheus:
  prometheusSpec:
    scrapeInterval: 10s
    evaluationInterval: 10s
    retention: 2d
    retentionSize: 1GB
    # Pick up ServiceMonitors, PodMonitors and rules from every namespace.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1280Mi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }

grafana:
  defaultDashboardsEnabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    users:
      default_theme: dark
    auth.anonymous:
      enabled: true
      org_role: Viewer
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    news:
      news_feed_enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 128Mi }
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 320Mi }
