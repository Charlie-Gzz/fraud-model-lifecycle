# Argo Rollouts controls the model service canary.
installCRDs: true
keepCRDs: false

controller:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }

dashboard:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
